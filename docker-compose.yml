# 주식 자동매매 시스템 로컬/개발 오케스트레이션
# Stock auto-trading system local/dev orchestration
# 시크릿은 모두 .env 파일(레포에 커밋하지 않음)에서 주입한다. Secrets are all injected from an untracked .env file.

# DB는 컨테이너로 띄우지 않는다 — PC에 이미 설치된 MySQL(JDWORKS DB)을 그대로 사용한다.
# host.docker.internal은 Docker Desktop(Windows/Mac)에서 컨테이너가 호스트 PC에 접속할 때 쓰는 주소.
# schema.sql은 docs/agents/dba/schema.sql을 mysql 클라이언트로 한 번 실행해 직접 적용할 것.
#
# No DB container here — connects directly to the MySQL (JDWORKS DB) already installed on this PC.
# host.docker.internal is how a container reaches the host PC under Docker Desktop (Windows/Mac).
# Apply docs/agents/dba/schema.sql once via the mysql client yourself before first run.

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  ml-service:
    build: ./ml-service
    environment:
      # trading_feature_daily 읽기 전용 조회용 — ml-service는 자체 별도 자격증명으로 접속한다 (Review 산출물 참고).
      # Read-only trading_feature_daily lookups — ml-service connects with its own separate credentials (see Review output).
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-JDWORKS}
      DB_USER: ${DB_USER:-jdwadmin}
      DB_PASSWORD: ${DB_PASSWORD:-!jdwadmin}
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-JDWORKS}
      DB_USER: ${DB_USER:-jdwadmin}
      DB_PASSWORD: ${DB_PASSWORD:-!jdwadmin}
      TRADING_MODE: ${TRADING_MODE:-MOCK}
      KIWOOM_BASE_URL: ${KIWOOM_BASE_URL}
      KIWOOM_APP_KEY: ${KIWOOM_APP_KEY}
      KIWOOM_APP_SECRET: ${KIWOOM_APP_SECRET}
      KIWOOM_ACCOUNT_NO: ${KIWOOM_ACCOUNT_NO}
      PREDICTION_SERVICE_URL: http://ml-service:8001
      SERVER_PORT: 8081
    ports:
      - "8081:8081"
    depends_on:
      ml-service:
        condition: service_healthy

  frontend:
    # 단독 실행형 Vue 앱 — JD WORK 등 외부 호스트 대시보드 없이 이 서비스만으로 UI가 뜬다.
    # Standalone Vue app — the UI comes up from this service alone, no external host dashboard (e.g. JD WORK) needed.
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
