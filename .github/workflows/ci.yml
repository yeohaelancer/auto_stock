name: CI

# 모의투자(MOCK) 검증까지의 기본 CI 파이프라인. 실거래 배포는 별도 수동 워크플로우로 분리 (설계 §3.3, §11).
# Base CI pipeline through mock-mode verification. Live-trading deploys are a separate manual workflow (design doc §3.3, §11).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build & test
        working-directory: backend
        run: ./gradlew build --no-daemon

  ml-service-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: ml-service
        run: pip install -r requirements.txt
      - name: Import check
        working-directory: ml-service
        run: python -c "import main"

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-build, ml-service-lint]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t autotrading-backend:ci .
      - name: Build ml-service image
        run: docker build -t autotrading-ml-service:ci ./ml-service
