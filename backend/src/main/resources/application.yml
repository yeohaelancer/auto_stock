# 주식 자동매매 백엔드 설정
# Stock auto-trading backend configuration

# 실제 기동 테스트 중 발견: 콘솔 로그의 한글 주석/메시지가 깨져 나옴 (Windows 콘솔 인코딩 문제) — 명시적으로 UTF-8 지정
# Found during a real boot test: Korean log messages were garbled on console (Windows console encoding) — force UTF-8
logging:
  charset:
    console: UTF-8
    file: UTF-8

server:
  port: ${SERVER_PORT:8081}

spring:
  datasource:
    # PC에 이미 설치된 MySQL 인스턴스를 사용 — 기본값은 로컬 개발용, 운영 시 환경변수로 재정의 가능
    # Uses the MySQL instance already installed on this PC — defaults are for local dev, override via env vars in production
    url: "jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:JDWORKS}?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8"
    username: ${DB_USER:jdwadmin}
    password: "${DB_PASSWORD:!jdwadmin}" # 반드시 환경변수로 주입 권장 (recommended to inject via environment variable)
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-handlers-package: com.jdwork.autotrading.config.mybatis
  configuration:
    map-underscore-to-camel-case: true

trading:
  # MOCK: 모의투자 / LIVE: 실거래 — 설정값 변경만으로 전환 (설계 원칙 §3.3)
  # MOCK: paper trading / LIVE: real trading — switched via config only (design doc §3.3)
  mode: ${TRADING_MODE:MOCK}
  kiwoom:
    base-url: ${KIWOOM_BASE_URL:https://mockapi.kiwoom.com} # 모의투자 기본값, 실전은 별도 URL로 환경변수 교체
    app-key: ${KIWOOM_APP_KEY:}
    app-secret: ${KIWOOM_APP_SECRET:}
    account-no: ${KIWOOM_ACCOUNT_NO:}
    # 종목별 반복 호출(일별주가 등)에 대한 초당 요청 한도 — 실측 결과, 미적용 시 20종목 연속 호출만으로도
    # 429 Too Many Requests 발생 (bucket4j, KiwoomMarketRestClient). 값 근거 없음 — 운영 중 조정 필요.
    # Per-second request cap for repeated per-stock calls (e.g. daily price) — observed in practice that
    # firing 20 stocks back-to-back with no limit alone triggers 429 Too Many Requests (bucket4j, in
    # KiwoomMarketRestClient). Not backed by an official published limit — tune based on real usage.
    rate-limit-per-second: ${KIWOOM_RATE_LIMIT_PER_SECOND:4}
  risk:
    daily-loss-limit-rate: ${DAILY_LOSS_LIMIT_RATE:0.03} # 일일 최대 손실 한도 3% (기본값, 운영 시 조정)
    max-position-ratio-per-stock: ${MAX_POSITION_RATIO_PER_STOCK:0.1} # 종목당 최대 비중 10%
    min-cash-ratio: ${MIN_CASH_RATIO:0.2} # 최소 현금 보유 비율 20%
    # 과다매매(잦은 재매매) 방지 — 사용자 요청(수수료 부담 완화)으로 추가 (설계 §6 "이상 매매 감지")
    cooldown-trading-days: ${COOLDOWN_TRADING_DAYS:3} # 종목별 재매매 최소 간격(거래일 근사)
    max-daily-trades: ${MAX_DAILY_TRADES:5} # 계좌 전체 일일 최대 거래 횟수
  prediction:
    service-url: ${PREDICTION_SERVICE_URL:http://localhost:8001} # FastAPI ML 서비스
  mock:
    # 모의투자 초기 시드머니 — 현금 잔고는 "시드머니 - 누적매수 + 누적매도"로 계산한다 (BUG-006).
    # 실거래(LIVE)에는 사용하지 않음: LIVE 잔고는 반드시 실제 계좌 조회 API로만 산정해야 한다.
    initial-capital: ${MOCK_INITIAL_CAPITAL:10000000}
  universe:
    # 이 기간(영업일 근사치, 달력일 기준) 동안 시세가 없으면 거래정지 후보로 표시 (preMarketJob 휴리스틱)
    stale-trading-days: ${UNIVERSE_STALE_TRADING_DAYS:5}
    # 자동 유니버스 크기 — 코스피+코스닥 거래대금 상위를 합쳐 이 개수만큼 자동 선정 (사용자 요청, 확정값 20)
    auto-select-size: ${UNIVERSE_AUTO_SELECT_SIZE:20}
  backtest:
    # 매수+매도 양방향 거래대금 기준 비용률 — 수수료+세금 등을 뭉뚱그린 근사치, 운영 시 조정 필요
    commission-rate: ${BACKTEST_COMMISSION_RATE:0.00015}
    slippage-rate: ${BACKTEST_SLIPPAGE_RATE:0.001}
