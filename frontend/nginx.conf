# 단독 실행 컨테이너용 Nginx 설정 — 정적 파일 서빙 + /api를 백엔드 컨테이너로 프록시.
# Nginx config for the standalone container — serves static files and proxies /api to the backend container.
server {
    listen 80;

    location /api/ {
        proxy_pass http://backend:8081/api/;
        proxy_set_header Host $host;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
